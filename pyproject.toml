[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wa"
dynamic = ["version"]
description = "Workflow Assistant CLI: centralizes project workspaces, environment variables, custom scripts, notes and tasks."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
wa = "wa.cli:app"

# The version comes from the latest git tag (vX.Y.Z), resolved at build/install
# time -- an editable install must be reinstalled to pick up a new tag.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/wa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
